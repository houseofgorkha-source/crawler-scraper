# Single-machine V1. Every service here has a managed equivalent, so the
# scale-out path is a connection-string change, not a rewrite.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crawler
      POSTGRES_PASSWORD: crawler
    command: >
      postgres -c max_connections=200
               -c shared_buffers=1GB
               -c work_mem=32MB
               -c random_page_cost=1.1
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports: ["5432:5432"]

  redis:
    image: redis:7-alpine
    # Cache semantics, stated explicitly: no AOF, bounded memory, evict under
    # pressure. Anything that cannot survive a Redis flush belongs in Postgres.
    command: redis-server --maxmemory 2gb --maxmemory-policy allkeys-lru --appendonly no
    ports: ["6379:6379"]

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes: [miniodata:/data]
    ports: ["9000:9000", "9001:9001"]

  meilisearch:
    image: getmeili/meilisearch:v1.10
    environment:
      MEILI_MASTER_KEY: devkey
      MEILI_NO_ANALYTICS: "true"
    volumes: [meilidata:/meili_data]
    ports: ["7700:7700"]

volumes:
  pgdata:
  miniodata:
  meilidata:
